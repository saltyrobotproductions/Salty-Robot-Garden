// ── Confirm Dialog ────────────────────────────────────────────────────────────
function Confirm({msg, onYes, onNo}) {
  return React.createElement("div",{onClick:onNo,style:{position:"fixed",inset:0,background:"rgba(0,0,0,.88)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:"20px",fontFamily:F}},
    React.createElement("div",{onClick:e=>e.stopPropagation(),style:{background:"#0f1f0f",border:"1px solid #c0392b",borderRadius:16,padding:"24px 20px",maxWidth:320,width:"100%",textAlign:"center"}},
      React.createElement("div",{style:{fontSize:28,marginBottom:12}},"⚠️"),
      React.createElement("div",{style:{color:"#e8d5b7",fontSize:15,fontWeight:700,marginBottom:8,lineHeight:1.4}},msg),
      React.createElement("div",{style:{color:"#888",fontSize:12,marginBottom:20}},"This cannot be undone."),
      React.createElement("div",{style:{display:"flex",gap:10}},
        React.createElement("button",{onClick:onNo,style:{flex:1,padding:"12px",background:"#162a16",border:"1px solid #2a5225",borderRadius:9,color:"#81c784",fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:F}},"Cancel"),
        React.createElement("button",{onClick:onYes,style:{flex:1,padding:"12px",background:"#c0392b",border:"none",borderRadius:9,color:"#fff",fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:F}},"Yes, Clear")
      )
    )
  );
}

// ── Toast ─────────────────────────────────────────────────────────────────────
function Toast({msg}) {
  return msg ? React.createElement("div",{style:{position:"fixed",bottom:88,left:"50%",transform:"translateX(-50%)",background:"#2a5225",color:"#c8e6c9",padding:"10px 22px",borderRadius:22,fontSize:13,fontWeight:700,boxShadow:"0 4px 20px rgba(0,0,0,.5)",zIndex:150,whiteSpace:"nowrap",fontFamily:F}},msg) : null;
}

// ── Upload Modal ──────────────────────────────────────────────────────────────
function UploadModal({plants, onClose}) {
  const harvests = [], notes = [];
  Object.values(plants).forEach(p => {
    p.harvests.forEach(h => harvests.push(fmtD(h.date)+" | "+p.name+" | "+h.weight+h.unit+(h.qty?" | Qty: "+h.qty:"")+(h.note?" | "+h.note:"")));
    p.notes.forEach(n => notes.push(fmtD(n.date)+" | "+p.name+" | "+n.text));
  });
  const text = "FORT MILL GARDEN DATA EXPORT\nDate: "+new Date().toLocaleDateString()+"\n\n=== HARVEST LOG ===\n"+(harvests.length?harvests.join("\n"):"No harvests logged yet")+"\n\n=== PLANT NOTES ===\n"+(notes.length?notes.join("\n"):"No notes logged yet");
  const copy = () => navigator.clipboard.writeText(text).catch(()=>{});
  const inp = {background:"#060e06",border:"1px solid #2a5225",borderRadius:7,color:"#9ed49e",fontSize:10,padding:"10px",width:"100%",minHeight:180,resize:"none",fontFamily:"monospace",lineHeight:1.6,outline:"none"};
  return React.createElement("div",{onClick:onClose,style:{position:"fixed",inset:0,background:"rgba(0,0,0,.85)",zIndex:80,display:"flex",alignItems:"flex-end",backdropFilter:"blur(6px)"}},
    React.createElement("div",{onClick:e=>e.stopPropagation(),style:{background:"#0b1a0b",border:"1px solid #52b788",borderRadius:"22px 22px 0 0",width:"100%",maxWidth:520,margin:"0 auto",maxHeight:"82vh",overflowY:"auto",paddingBottom:36,fontFamily:F}},
      React.createElement("div",{style:{textAlign:"center",padding:"12px 0 4px"}},React.createElement("div",{style:{display:"inline-block",width:36,height:4,borderRadius:2,background:"#52b788"}})),
      React.createElement("div",{style:{padding:"12px 18px 0"}},
        React.createElement("div",{style:{fontFamily:PF,fontSize:18,fontWeight:700,color:"#b8dfba",marginBottom:4}},"📤 Export to Claude"),
        React.createElement("div",{style:{color:"#6aaa6e",fontSize:12,marginBottom:12}},"Copy this and paste into your Claude chat → say \"log this to Google Sheets\""),
        React.createElement("textarea",{readOnly:true,value:text,style:inp}),
        React.createElement("button",{onClick:copy,style:{width:"100%",padding:"13px",background:"#52b788",border:"none",borderRadius:10,color:"#0b1a0b",fontSize:15,fontWeight:900,cursor:"pointer",fontFamily:F,marginTop:10,marginBottom:8}},"📋 Copy All Data"),
        React.createElement("div",{style:{color:"#2a5225",fontSize:11,textAlign:"center",marginBottom:10}},"Then paste into Claude and say \"log this to Google Sheets\""),
        React.createElement("button",{onClick:onClose,style:{width:"100%",padding:"11px",background:"transparent",border:"1px solid #2a5225",borderRadius:10,color:"#4caf50",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:F}},"Close")
      )
    )
  );
}

  const [note, setNote] = useState("");
  const [hWeight, setHWeight] = useState("");
  const [hUnit, setHUnit] = useState("oz");
  const [hQty, setHQty] = useState("");
  const [hNote, setHNote] = useState("");
  const s = ST[plant.status]||ST.growing;
  const inp = {background:"#0b1a0b",border:"1px solid #2a5225",borderRadius:7,color:"#b8dfba",fontSize:14,padding:"9px 10px",outline:"none",fontFamily:F,width:"100%"};
  const saveNote = () => { if(note.trim()){onSaveNote(plant.id,note.trim());setNote("");} };

    if(!hWeight&&!hQty) return;
    onSaveHarvest(plant.id,{weight:hWeight,unit:hUnit,qty:hQty,note:hNote,date:new Date().toISOString()});
    setHWeight("");setHQty("");setHNote("");

      React.createElement("div",{style:{textAlign:"center",padding:"12px 0 4px"}},React.createElement("div",{style:{display:"inline-block",width:36,height:4,borderRadius:2,background:"#2a5225"}})),

        React.createElement("div",{style:{flex:1}},
          React.createElement("div",{style:{fontFamily:PF,fontSize:18,fontWeight:700,color:"#b8dfba",lineHeight:1.2}},plant.name),

            plant.count&&React.createElement("span",{style:{background:"#162a16",color:"#81c784",border:"1px solid #2a5225",borderRadius:20,padding:"2px 9px",fontSize:10}},plant.count),
            React.createElement("span",{style:{background:"#162a16",color:"#6aaa6e",borderRadius:20,padding:"2px 9px",fontSize:10}},plant.zone)
          )
        ),
        React.createElement("button",{onClick:onClose,style:{background:"#162a16",border:"none",color:"#81c784",width:30,height:30,borderRadius:"50%",fontSize:18,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}},"×")
      ),
      // sub-tabs
      React.createElement("div",{style:{display:"flex",borderBottom:"1px solid #162a16"}},
        [["info","📋 Info"],["harvest","🌾 Harvest"],["notes","📝 Notes"]].map(([v,l])=>
          React.createElement("button",{key:v,onClick:()=>setTab(v),style:{flex:1,padding:"10px 4px",background:tab===v?"#162a16":"transparent",border:"none",borderBottom:tab===v?"2px solid #52b788":"2px solid transparent",color:tab===v?"#c8e6c9":"#4caf50",fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:F}},l)
        )
      ),
      React.createElement("div",{style:{padding:"14px 18px 0"}},
        // INFO
        tab==="info"&&React.createElement(React.Fragment,null,
          React.createElement("div",{style:{background:"#081408",border:"1px solid #2a5225",borderRadius:10,padding:"10px 14px",marginBottom:12}},
            React.createElement("div",{style:{color:"#4caf50",fontSize:10,fontWeight:800,letterSpacing:1,textTransform:"uppercase",marginBottom:3}},"📅 Estimated Harvest"),
            React.createElement("div",{style:{color:"#b8dfba",fontSize:17,fontWeight:700}},plant.harvest)
          ),
          React.createElement("div",{style:{background:"#081420",border:"1px solid #1a4060",borderRadius:10,padding:"10px 14px",marginBottom:12}},
            React.createElement("div",{style:{color:"#4fc3f7",fontSize:10,fontWeight:800,letterSpacing:1,textTransform:"uppercase",marginBottom:8}},"💧 Watering"),
            React.createElement("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6,textAlign:"center"}},
              [["Weekly",plant.watering],["Per Session",plant.gal],["Pump Time",plant.sec]].map(([l,v])=>
                React.createElement("div",{key:l},React.createElement("div",{style:{color:"#4fc3f7",fontSize:9,marginBottom:2}},l),React.createElement("div",{style:{color:"#b3e5fc",fontSize:12,fontWeight:700}},v))
              )
            )

          React.createElement("div",{style:{background:"#141400",border:"1px solid #3a3a10",borderRadius:10,padding:"10px 14px"}},
            React.createElement("div",{style:{color:"#ffcc02",fontSize:10,fontWeight:800,letterSpacing:1,textTransform:"uppercase",marginBottom:8}},"🌱 Fertilizer"),
            Object.entries(plant.fert).map(([k,v])=>

          React.createElement("div",{style:{color:"#81c784",fontSize:10,fontWeight:800,letterSpacing:1,textTransform:"uppercase",marginBottom:8}},"History ("+plant.harvests.length+")"),
          plant.harvests.length===0
            ?React.createElement("div",{style:{color:"#2a5225",fontSize:12,fontStyle:"italic"}},"No harvests logged yet")
            :plant.harvests.slice().reverse().map((h,i)=>
              React.createElement("div",{key:i,style:{background:"#081408",border:"1px solid #162a16",borderRadius:8,padding:"8px 12px",marginBottom:6}},
                React.createElement("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:2}},
                  React.createElement("span",{style:{color:"#4caf50",fontSize:10}},fmt(h.date)),
                  React.createElement("span",{style:{color:"#ffd54f",fontSize:13,fontWeight:700}},h.weight+h.unit+(h.qty?" · "+h.qty+" items":""))
                ),
                h.note&&React.createElement("div",{style:{color:"#9ed49e",fontSize:12,marginTop:2}},h.note)
              )
            )
        ),
        // NOTES
        tab==="notes"&&React.createElement(React.Fragment,null,
          React.createElement("div",{style:{background:"#081408",border:"1px solid #2a5225",borderRadius:10,padding:"12px",marginBottom:12}},
            React.createElement("div",{style:{color:"#81c784",fontSize:10,fontWeight:800,letterSpacing:1,textTransform:"uppercase",marginBottom:8}},"Add Note"),
            React.createElement("textarea",{value:note,onChange:e=>setNote(e.target.value),placeholder:"e.g. First flower spotted, pest damage, harvested today...",style:{...inp,minHeight:78,resize:"vertical",marginBottom:8}}),
            React.createElement("button",{onClick:saveNote,style:{width:"100%",padding:"11px",background:"#2a5225",border:"none",borderRadius:7,color:"#c8e6c9",fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:F}},"Save Note")
          ),
          React.createElement("div",{style:{color:"#81c784",fontSize:10,fontWeight:800,letterSpacing:1,textTransform:"uppercase",marginBottom:8}},"Notes ("+plant.notes.length+")"),
          plant.notes.length===0
            ?React.createElement("div",{style:{color:"#2a5225",fontSize:12,fontStyle:"italic"}},"No notes yet")
            :plant.notes.slice().reverse().map((n,i)=>
              React.createElement("div",{key:i,style:{background:"#081408",border:"1px solid #162a16",borderRadius:8,padding:"8px 12px",marginBottom:6}},
                React.createElement("div",{style:{color:"#4caf50",fontSize:10,marginBottom:3}},fmt(n.date)),
                React.createElement("div",{style:{color:"#b8dfba",fontSize:13,lineHeight:1.5}},n.text)
              )
            )
        )
      )
    )
  );
}

// ── Settings Page ─────────────────────────────────────────────────────────────
function SettingsPage({plants, onReset, showToast}) {
  const [confirm, setConfirm] = useState(null);
  const plantsWithNotes = Object.values(plants).filter(p=>p.notes.length>0);
  const totalH = Object.values(plants).reduce((a,p)=>a+p.harvests.length,0);
  const totalN = Object.values(plants).reduce((a,p)=>a+p.notes.length,0);

  const ask = (msg, action) => setConfirm({msg, action});
  const yes = () => { confirm.action(); setConfirm(null); };

  const section = (title, children) =>
    React.createElement("div",{style:{marginBottom:24}},
      React.createElement("div",{style:{color:"#6aaa6e",fontSize:10,fontWeight:800,letterSpacing:1.2,textTransform:"uppercase",marginBottom:10,paddingBottom:6,borderBottom:"1px solid #162a16"}},title),
      children
    );

  const resetBtn = (label, sub, color, action) =>
    React.createElement("button",{onClick:action,style:{width:"100%",padding:"14px 16px",background:"#0f1f0f",border:"1px solid "+color,borderRadius:12,color:color,fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:F,textAlign:"left",display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}},
      React.createElement("div",null,
        React.createElement("div",null,label),
        React.createElement("div",{style:{fontSize:11,fontWeight:400,color:"#555",marginTop:2}},sub)
      ),
      React.createElement("span",{style:{fontSize:18}},"›")
    );

  return React.createElement("div",{style:{padding:"16px 14px",fontFamily:F}},
    React.createElement("div",{style:{fontFamily:PF,fontSize:20,fontWeight:700,color:"#9ed49e",marginBottom:4}},"⚙️ Settings"),
    React.createElement("div",{style:{color:"#4caf50",fontSize:11,marginBottom:20}},"Version 2.0 · Fort Mill, SC Spring 2026"),

    // stats
    React.createElement("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:24}},
      [["🌾 Harvests",totalH,"#ffd54f","#2a2a00"],["📝 Notes",totalN,"#4fc3f7","#001a2a"]].map(([l,v,c,bg])=>
        React.createElement("div",{key:l,style:{background:bg,border:"1px solid "+c+"44",borderRadius:12,padding:"12px",textAlign:"center"}},
          React.createElement("div",{style:{color:c,fontSize:22,fontWeight:900}},v),
          React.createElement("div",{style:{color:c,fontSize:10,opacity:.7,marginTop:2}},l)
        )
      )
    ),

    section("🗑 Reset All Data",
      React.createElement(React.Fragment,null,
        resetBtn("Clear All Data","Wipes all notes AND all harvests for every plant","#c0392b",
          ()=>ask("Clear ALL notes and harvests for every plant?",()=>{onReset("all");showToast("All data cleared");})
        ),
        resetBtn("Clear All Harvests","Removes harvest logs only · Notes stay intact","#e67e22",
          ()=>ask("Clear all harvest logs? Your notes will be kept.",()=>{onReset("harvests");showToast("All harvests cleared");})
        ),
        resetBtn("Clear All Notes","Removes notes only · Harvests stay intact","#f39c12",
          ()=>ask("Clear all notes? Your harvest logs will be kept.",()=>{onReset("notes");showToast("All notes cleared");})
        )
      )
    ),

    plantsWithNotes.length>0 && section("🌱 Clear Notes by Plant",
      React.createElement("div",{style:{display:"flex",flexDirection:"column",gap:6}},
        plantsWithNotes.map(p=>{
          const s = ST[p.status]||ST.growing;
          return React.createElement("div",{key:p.id,style:{background:s.bg,border:"1px solid "+s.br,borderRadius:10,padding:"10px 14px",display:"flex",alignItems:"center",justifyContent:"space-between"}},
            React.createElement("div",{style:{display:"flex",alignItems:"center",gap:8}},
              React.createElement("span",{style:{fontSize:20}},p.emoji),
              React.createElement("div",null,
                React.createElement("div",{style:{color:s.tx,fontWeight:700,fontSize:13}},p.name),
                React.createElement("div",{style:{color:s.tx,fontSize:11,opacity:.7}},p.notes.length+" note"+(p.notes.length>1?"s":""))
              )
            ),
            React.createElement("button",{onClick:()=>ask("Clear all notes for "+p.name+"?",()=>{onReset("plantNotes",p.id);showToast(p.name+" notes cleared");}),
              style:{background:"#c0392b22",border:"1px solid #c0392b",borderRadius:8,color:"#c0392b",padding:"6px 12px",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:F}},"Clear")
          );
        })
      )
    ),

    confirm && React.createElement(Confirm,{msg:confirm.msg,onYes:yes,onNo:()=>setConfirm(null)})
  );
}

// ── Cell ──────────────────────────────────────────────────────────────────────
function Cell({plant, onClick, style}) {
  if(!plant) return null;
  const s = ST[plant.status]||ST.growing;
  const hH = plant.harvests.length>0, hN = plant.notes.length>0;
  return React.createElement("div",{onClick:()=>onClick(plant),
    style:{background:s.bg,border:"2px solid "+s.br,borderRadius:7,padding:"3px 2px",cursor:"pointer",
      display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",
      position:"relative",overflow:"hidden",
      boxShadow:hH?"0 0 0 2px #ffd54f":hN?"0 0 0 2px #4fc3f7":"none",transition:"transform .1s",...style},
    onTouchStart:e=>e.currentTarget.style.transform="scale(.93)",
    onTouchEnd:e=>e.currentTarget.style.transform="scale(1)"
  },
    s.badge&&React.createElement("div",{style:{position:"absolute",top:1,right:1,background:s.br,color:"#fff",fontSize:6,fontWeight:800,padding:"1px 3px",borderRadius:3}},s.badge),
    (hH||hN)&&React.createElement("div",{style:{position:"absolute",top:1,left:1,fontSize:7}},hH?"🌾":"📝"),
    React.createElement("span",{style:{fontSize:17,lineHeight:1,marginBottom:1}},plant.emoji),
    React.createElement("div",{style:{color:s.tx,fontSize:7.5,fontWeight:700,textAlign:"center",lineHeight:1.15,wordBreak:"break-word",padding:"0 1px",fontFamily:F}},plant.name.length>15?plant.name.slice(0,13)+"…":plant.name),
    plant.count&&React.createElement("div",{style:{color:s.tx,fontSize:7,opacity:.8,fontFamily:F}},plant.count)
  );
}

// ── Row Item ──────────────────────────────────────────────────────────────────
function RowItem({plant, label, onClick}) {
  const s = ST[plant.status]||ST.growing;
  return React.createElement("div",{onClick:()=>onClick(plant),
    style:{background:s.bg,border:"2px solid "+s.br,borderRadius:12,padding:"12px 14px",cursor:"pointer",
      display:"flex",alignItems:"center",gap:12,fontFamily:F,
      boxShadow:plant.harvests.length>0?"0 0 0 2px #ffd54f":plant.notes.length>0?"0 0 0 2px #4fc3f7":"none"}},
    React.createElement("span",{style:{fontSize:26}},plant.emoji),
    React.createElement("div",{style:{flex:1}},
      React.createElement("div",{style:{color:s.tx,fontWeight:700,fontSize:14}},label?label+": "+plant.name:plant.name),
      React.createElement("div",{style:{color:s.tx,fontSize:11,opacity:.75,marginTop:2}},plant.status+" · "+plant.watering+" · "+plant.harvest)
    ),
    plant.harvests.length>0&&React.createElement("span",{style:{fontSize:12}},"🌾"),
    plant.notes.length>0&&React.createElement("span",{style:{fontSize:12}},"📝"),
    React.createElement("span",{style:{color:s.br,fontSize:20}},"›")
  );
}

// ── Main App ──────────────────────────────────────────────────────────────────
function App() {
  const [plants, setPlants] = useState(()=>{
    try {
      const s = localStorage.getItem("fmg_v2");
      if(s){const d=JSON.parse(s);const m={};Object.keys(PLANTS).forEach(id=>{m[id]={...PLANTS[id],notes:d[id]?.notes||[],harvests:d[id]?.harvests||[]};});return m;}
    } catch(e){}
    return JSON.parse(JSON.stringify(PLANTS));
  });
  const [selected, setSelected] = useState(null);
  const [tab, setTab] = useState("map");
  const [toast, setToast] = useState("");
  const [showUpload, setShowUpload] = useState(false);

  useEffect(()=>{
    const d={};Object.keys(plants).forEach(id=>{d[id]={notes:plants[id].notes,harvests:plants[id].harvests};});
    try{localStorage.setItem("fmg_v2",JSON.stringify(d));}catch(e){}
  },[plants]);

  const showToast = msg => { setToast(msg); setTimeout(()=>setToast(""),2200); };

  const saveNote    = (id,text) => { setPlants(p=>({...p,[id]:{...p[id],notes:[...p[id].notes,{text,date:new Date().toISOString()}]}})); showToast("Note saved ✓"); };
  const saveHarvest = (id,data) => { setPlants(p=>({...p,[id]:{...p[id],harvests:[...p[id].harvests,data]}})); showToast("Harvest logged ✓"); };

  const handleReset = (type, plantId) => {
    setPlants(prev => {
      const next = {...prev};
      if(type==="all")         Object.keys(next).forEach(id=>{next[id]={...next[id],notes:[],harvests:[]};});
      else if(type==="harvests") Object.keys(next).forEach(id=>{next[id]={...next[id],harvests:[]};});
      else if(type==="notes")    Object.keys(next).forEach(id=>{next[id]={...next[id],notes:[]};});
      else if(type==="plantNotes"&&plantId) next[plantId]={...next[plantId],notes:[]};
      return next;
    });
  };

  const totalH = Object.values(plants).reduce((a,p)=>a+p.harvests.length,0);
  const totalN = Object.values(plants).reduce((a,p)=>a+p.notes.length,0);

  const done = new Set(); const cells = [];
  for(let r=0;r<4;r++) for(let c=0;c<6;c++){
    const id=GRID[r][c]; if(done.has(id))continue; done.add(id);
    let rs=1,cs=1;
    while(r+rs<4&&GRID[r+rs][c]===id)rs++;
    while(c+cs<6&&GRID[r][c+cs]===id)cs++;
    cells.push({id,r,c,rs,cs});
  }

  const TABS = [["map","🗺"],["beds","🪴"],["data","📊"],["settings","⚙️"]];

  return React.createElement("div",{style:{height:"100%",display:"flex",flexDirection:"column",background:"#060e06",fontFamily:F,color:"#c8e6c9",overflow:"hidden"}},

    // header
    React.createElement("div",{style:{background:"linear-gradient(160deg,#0a1f0a,#0d280d)",borderBottom:"1px solid #162a16",padding:"14px 14px 10px",flexShrink:0}},
      React.createElement("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}},
        React.createElement("div",null,
          React.createElement("div",{style:{fontFamily:PF,fontSize:20,fontWeight:700,color:"#9ed49e"}},"🌿 Fort Mill Garden"),
          React.createElement("div",{style:{fontSize:10,color:"#4caf50",marginTop:1}},"Spring 2026 · Fort Mill, SC")
        ),
        React.createElement("div",{style:{display:"flex",gap:6}},
          totalN>0&&React.createElement("div",{style:{background:"#0a2a2a",border:"1px solid #1a4060",borderRadius:14,padding:"4px 10px",fontSize:10,color:"#4fc3f7"}},totalN+" 📝"),
          totalH>0&&React.createElement("div",{onClick:()=>setShowUpload(true),style:{background:"#1a2a0a",border:"1px solid #52b788",borderRadius:14,padding:"4px 10px",fontSize:10,color:"#81c784",cursor:"pointer"}},totalH+" 🌾 Upload")
        )
      ),
      React.createElement("div",{style:{display:"flex",gap:5}},
        TABS.map(([v,l])=>
          React.createElement("button",{key:v,onClick:()=>setTab(v),style:{flex:1,padding:"7px 2px",borderRadius:8,border:tab===v?"1px solid #52b788":"1px solid #162a16",background:tab===v?"#2a5225":"#0a1a0a",color:tab===v?"#c8e6c9":"#4caf50",fontSize:14,cursor:"pointer",fontFamily:F}},l)
        )
      )
    ),

    // content
    React.createElement("div",{style:{flex:1,overflowY:"auto",padding:tab==="settings"?"0":"10px 12px"}},

      // MAP
      tab==="map"&&React.createElement(React.Fragment,null,
        React.createElement("div",{style:{background:"#3a2010",border:"1px solid #6b3a1a",borderRadius:6,padding:"5px",textAlign:"center",fontSize:9,color:"#d4a96a",fontWeight:700,letterSpacing:1,marginBottom:5}},"▲ NORTH — FENCE"),
        React.createElement("div",{style:{display:"flex",marginBottom:3}},
          React.createElement("div",{style:{flex:3,textAlign:"center",fontSize:8,color:"#81c784",fontStyle:"italic"}},"◀ GARAGE SHADE"),
          React.createElement("div",{style:{flex:3,textAlign:"center",fontSize:8,color:"#ffd166",fontStyle:"italic"}},"FULL SUN ▶")
        ),
        React.createElement("div",{style:{display:"grid",gridTemplateColumns:"repeat(6,1fr)",gridTemplateRows:"repeat(4,58px)",gap:3,marginBottom:5}},
          cells.map(({id,r,c,rs,cs})=>React.createElement(Cell,{key:id,plant:plants[id],onClick:setSelected,style:{gridColumn:`${c+1}/span ${cs}`,gridRow:`${r+1}/span ${rs}`,height:"100%"}}))
        ),
        React.createElement("div",{style:{background:"#222",border:"1px solid #555",borderRadius:6,padding:"5px",textAlign:"center",fontSize:9,color:"#aaa",fontWeight:700,letterSpacing:1,marginBottom:8}},"▼ SOUTH — GARAGE"),
        React.createElement("div",{style:{display:"flex",gap:3,marginBottom:10}},["R1","R2","R3","R4","R5","R6"].map(l=>React.createElement("div",{key:l,style:{flex:1,textAlign:"center",fontSize:8,color:"#4caf50"}},l))),
        React.createElement("div",{style:{background:"#0a1a0a",borderRadius:10,padding:"8px",display:"flex",flexWrap:"wrap",gap:5}},
          Object.entries(ST).map(([k,v])=>React.createElement("div",{key:k,style:{display:"flex",alignItems:"center",gap:3}},React.createElement("div",{style:{width:8,height:8,borderRadius:2,background:v.bg,border:"1px solid "+v.br}}),React.createElement("span",{style:{fontSize:9,color:"#81c784",textTransform:"capitalize"}},k))),
          React.createElement("div",{style:{display:"flex",alignItems:"center",gap:3}},React.createElement("div",{style:{width:8,height:8,borderRadius:2,background:"#0a1a0a",border:"2px solid #ffd54f"}}),React.createElement("span",{style:{fontSize:9,color:"#ffd54f"}},"harvest"))
        )
      ),

      // BEDS
      tab==="beds"&&React.createElement(React.Fragment,null,
        React.createElement("div",{style:{color:"#ffd166",fontSize:10,fontWeight:800,letterSpacing:1,textTransform:"uppercase",marginBottom:8}},"Raised Beds"),
        React.createElement("div",{style:{display:"flex",flexDirection:"column",gap:7,marginBottom:18}},RAISED.map(({id,label})=>React.createElement(RowItem,{key:id,plant:plants[id],label,onClick:setSelected}))),
        React.createElement("div",{style:{color:"#ffd166",fontSize:10,fontWeight:800,letterSpacing:1,textTransform:"uppercase",marginBottom:8}},"Second Garden"),
        React.createElement("div",{style:{display:"flex",flexDirection:"column",gap:7,marginBottom:18}},SECOND.map(({id,label})=>React.createElement(RowItem,{key:id,plant:plants[id],label,onClick:setSelected}))),
        React.createElement("div",{style:{color:"#ffd166",fontSize:10,fontWeight:800,letterSpacing:1,textTransform:"uppercase",marginBottom:8}},"Containers & Other"),
        React.createElement("div",{style:{display:"flex",flexDirection:"column",gap:7}},OTHERS.map(id=>React.createElement(RowItem,{key:id,plant:plants[id],label:null,onClick:setSelected})))
      ),

      // DATA
      tab==="data"&&React.createElement(React.Fragment,null,
        React.createElement("div",{style:{color:"#81c784",fontSize:10,fontWeight:800,letterSpacing:1,textTransform:"uppercase",marginBottom:10}},"Harvest Log"),
        totalH===0
          ?React.createElement("div",{style:{color:"#2a5225",fontSize:13,fontStyle:"italic",textAlign:"center",padding:"20px 0"}},"No harvests logged yet.\nTap any plant → Harvest tab.")
          :React.createElement(React.Fragment,null,
            Object.values(plants).filter(p=>p.harvests.length>0).map(p=>
              React.createElement("div",{key:p.id,style:{marginBottom:14}},
                React.createElement("div",{style:{color:"#b8dfba",fontWeight:700,fontSize:13,marginBottom:5,display:"flex",alignItems:"center",gap:6}},
                  React.createElement("span",null,p.emoji),p.name,React.createElement("span",{style:{color:"#2a5225",fontSize:11,fontWeight:400}},"("+p.harvests.length+")")
                ),
                p.harvests.map((h,i)=>
                  React.createElement("div",{key:i,style:{background:"#081408",border:"1px solid #162a16",borderRadius:8,padding:"8px 12px",marginBottom:5}},
                    React.createElement("div",{style:{display:"flex",justifyContent:"space-between"}},
                      React.createElement("span",{style:{color:"#4caf50",fontSize:10}},fmtD(h.date)),
                      React.createElement("span",{style:{color:"#ffd54f",fontSize:13,fontWeight:700}},h.weight+h.unit+(h.qty?" · "+h.qty+" items":""))
                    ),
                    h.note&&React.createElement("div",{style:{color:"#9ed49e",fontSize:11,marginTop:2}},h.note)
                  )
                )
              )
            ),
            React.createElement("button",{onClick:()=>setShowUpload(true),style:{width:"100%",padding:"13px",background:"#2a5225",border:"none",borderRadius:10,color:"#c8e6c9",fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:F,marginTop:4}},"📤 Export to Claude → Google Sheets")
          )
      ),

      // SETTINGS
      tab==="settings"&&React.createElement(SettingsPage,{plants,onReset:handleReset,showToast})
    ),

    // modals
    selected&&React.createElement(PlantModal,{plant:plants[selected.id],onClose:()=>setSelected(null),onSaveNote:saveNote,onSaveHarvest:saveHarvest}),
    showUpload&&React.createElement(UploadModal,{plants,onClose:()=>setShowUpload(false)}),
    React.createElement(Toast,{msg:toast}),

    // bottom bar
    React.createElement("div",{style:{background:"#081408",borderTop:"1px solid #162a16",padding:"10px 16px",textAlign:"center",fontSize:9,color:"#2a5225",flexShrink:0,fontFamily:F}},"Tap any plant for details · Data saved on device · Export via Data tab")
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
